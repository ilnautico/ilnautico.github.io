<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>FairVia™ Technical Hypothesis Report</title> 

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --navy:#0C1C2E;
  --navy-soft:#2C4A6E;
  --block-light:#F9FCFF;
  --block-mid:#E6EFF8;
  --block-deep:#DDE8F2;
  --sep:#E6EDF3;
  --text-body:#374151;
  --text-muted:#6B7A8E;
  --text-label:#9AA5B4;
  --accent-warn:#CFAE5D;
  --accent-low:#7A6EB0;
  --accent-ok:#3B82A0;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#F4F7FA;
  font-family:'IBM Plex Sans',sans-serif;
  color:var(--text-body);
  font-size:13px;
  line-height:1.68;
}

.page{
  width:700px;
  margin:20mm auto;
  background:white;
  border:1px solid #E0E8EF;
  overflow:hidden;
}

.page-top-bar{
  height:4px;
  background:linear-gradient(90deg,#0C1C2E 0%,#2C4A6E 60%,#DDE8F2 100%);
}

/* ===== VISUAL ===== */

.visual-wrap{
  width:700px;
  margin:0 auto;
  background:var(--block-light);
  border:1px solid #D4E2EE;
  border-radius:10px;
  overflow:hidden;
}

.visual-inner{
  position:relative;
  width:100%;
  height:260px;
}

.visual-inner img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* ===== FIX: overlayを完全復元 ===== */

.overlay-layer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* ===== NEXT STEP ===== */

.nextstep-card{
  background:#FFFFFF;
  border:1px solid #D4E2EE;
  border-radius:10px;
  padding:16px 20px;
}

.nextstep-lead{
  font-size:12px;
  line-height:1.74;
  color:var(--text-body);
}

/* ===== FIX: page構造崩れ修正 ===== */

.section{
  margin-bottom:42px;
  page-break-inside:avoid;
}

.section + .section{
  padding-top:38px;
  border-top:1px solid var(--sep);
}

.page-break{
  page-break-before:always;
}

</style>
</head>

<body>

<div class="page">

<div class="page-top-bar"></div>

<!-- ===== VISUAL ===== -->

<div class="section">

<div class="visual-wrap">

<div class="visual-inner">

<img src="{{base_image}}">

<div class="overlay-layer">
{{dynamic_overlay}}
</div>

</div>
</div>

</div>

<!-- ===== NEXT STEP ===== -->

<div class="section">

<div class="nextstep-card">

<p class="nextstep-lead">
{{next_step}}
</p>

</div>

</div>

</div>

</body>
</html>
